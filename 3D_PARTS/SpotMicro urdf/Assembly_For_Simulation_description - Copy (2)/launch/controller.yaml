    type: effort_controllers/JointPositionController
    joint: BR_calf_joint
    pid: {p: 100.0, i: 0.01, d: 10.0}
  FR_calf_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: FR_calf_joint
    pid: {p: 100.0, i: 0.01, d: 10.0}
  FL_calf_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: FL_calf_joint
    pid: {p: 100.0, i: 0.01, d: 10.0}
  FL_thigh_joint_position_controller:
