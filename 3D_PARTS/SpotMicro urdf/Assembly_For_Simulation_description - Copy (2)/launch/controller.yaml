    joint: FL_thigh_joint
    pid: {p: 100.0, i: 0.01, d: 10.0}
  BL_thigh_joint_position_controller:
    type: effort_controllers/JointPositionController
    joint: BL_thigh_joint
    pid: {p: 100.0, i: 0.01, d: 10.0}
  BR_thigh_joint_position_controller:
